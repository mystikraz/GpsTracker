[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fleet-tracker"
version = "0.1.0"
description = "Multi-tenant JT/T 808 fleet tracking platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
fleet-tracker = "fleet_tracker.cli:main"
fleet-tracker-replay = "fleet_tracker.simulator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_tracker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
