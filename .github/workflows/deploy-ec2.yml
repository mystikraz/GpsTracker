name: Deploy GPS Tracker to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gps-tracker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"

      - name: Run backend tests
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web application
        working-directory: web
        run: npm ci && npm run build

  deploy:
    name: Deploy to EC2
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Synchronize application files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          APP_DIR="${EC2_APP_DIR:-/home/ubuntu/gps-tracker}"
          ssh -i "$HOME/.ssh/deploy_key" "$EC2_USER@$EC2_HOST" "mkdir -p '$APP_DIR'"
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude '.venv/' \
            --exclude '.uv-cache/' \
            --exclude 'web/node_modules/' \
            --exclude 'web/dist/' \
            -e "ssh -i $HOME/.ssh/deploy_key" \
            ./ "$EC2_USER@$EC2_HOST:$APP_DIR/"

      - name: Rebuild and restart services
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          APP_DIR="${EC2_APP_DIR:-/home/ubuntu/gps-tracker}"
          ssh -i "$HOME/.ssh/deploy_key" "$EC2_USER@$EC2_HOST" "cd '$APP_DIR' && test -f .env && docker compose up -d --build --remove-orphans"

      - name: Check service status
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          APP_DIR="${EC2_APP_DIR:-/home/ubuntu/gps-tracker}"
          ssh -i "$HOME/.ssh/deploy_key" "$EC2_USER@$EC2_HOST" "cd '$APP_DIR' && docker compose ps"
