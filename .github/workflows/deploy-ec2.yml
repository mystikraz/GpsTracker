name: Deploy GPS Tracker to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gps-tracker-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"

      - name: Run backend tests
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web application
        working-directory: web
        run: npm ci && npm run build

  deploy:
    name: Deploy to EC2 with SSM
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          RELEASE_BUCKET: ${{ secrets.RELEASE_BUCKET }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          test "$AWS_DEPLOY_ROLE_ARN" = "arn:aws:iam::816869990738:role/gps-tracker-github-actions-deploy"
          test "$RELEASE_BUCKET" = "gps-tracker-releases-816869990738-ap-south-1"
          test "$EC2_INSTANCE_ID" = "i-0554882b3f79e399f"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gps-tracker-${{ github.run_id }}

      - name: Package and upload release
        env:
          RELEASE_BUCKET: ${{ secrets.RELEASE_BUCKET }}
        run: |
          test -n "$RELEASE_BUCKET"
          tar --exclude='.git' \
            --exclude '.venv/' \
            --exclude '.uv-cache/' \
            --exclude 'web/node_modules/' \
            --exclude 'web/dist/' \
            -czf /tmp/gps-tracker-release.tar.gz .
          aws s3 cp /tmp/gps-tracker-release.tar.gz "s3://$RELEASE_BUCKET/releases/${GITHUB_SHA}.tar.gz"

      - name: Deploy release with SSM Run Command
        env:
          RELEASE_BUCKET: ${{ secrets.RELEASE_BUCKET }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          test -n "$RELEASE_BUCKET"
          test -n "$EC2_INSTANCE_ID"
          APP_DIR="${EC2_APP_DIR:-/home/ubuntu/gps-tracker}"
          test -n "$APP_DIR"
          jq -n \
            --arg bucket "$RELEASE_BUCKET" \
            --arg key "releases/${GITHUB_SHA}.tar.gz" \
            --arg app_dir "$APP_DIR" \
            '{commands: [
              "set -euo pipefail",
              ("test -f " + $app_dir + "/.env"),
              ("mkdir -p /tmp/gps-tracker-release && aws s3 cp s3://" + $bucket + "/" + $key + " /tmp/gps-tracker-release.tar.gz"),
              ("tar -xzf /tmp/gps-tracker-release.tar.gz -C " + $app_dir),
              ("cd " + $app_dir + " && sudo docker compose build --pull"),
              ("cd " + $app_dir + " && sudo docker compose run --rm -e MIGRATION_CONFIRM_PRODUCTION=1 migrate fleet-tracker migrate"),
              ("cd " + $app_dir + " && sudo docker compose up -d --no-build --no-deps api web ingestion worker"),
              ("cd " + $app_dir + " && sudo docker compose ps")
            ]}' > ssm-commands.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy GPS Tracker ${GITHUB_SHA}" \
            --parameters file://ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Verify deployed services
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          test -n "$EC2_INSTANCE_ID"
          APP_DIR="${EC2_APP_DIR:-/home/ubuntu/gps-tracker}"
          jq -n --arg app_dir "$APP_DIR" '{commands: [
            ("cd " + $app_dir + " && sudo docker compose ps"),
            ("test $(sudo docker inspect -f \"{{.State.Status}}\" gps-tracker-api-1) = running"),
            ("test $(sudo docker inspect -f \"{{.State.Status}}\" gps-tracker-web-1) = running"),
            ("test $(sudo docker inspect -f \"{{.State.Status}}\" gps-tracker-ingestion-1) = running")
          ]}' > ssm-verify-commands.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Verify GPS Tracker ${GITHUB_SHA}" \
            --parameters file://ssm-verify-commands.json \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
