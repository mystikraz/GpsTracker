services:
  migrate:
    build: .
    env_file: .env
    command: ["sh", "-c", "for attempt in 1 2 3 4 5 6; do fleet-tracker migrate && exit 0; sleep 5; done; exit 1"]
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  ingestion:
    build: .
    env_file: .env
    environment:
      TRACKER_PORT: "${TRACKER_PORT:-8881}"
    command: ["python", "-m", "fleet_tracker.ingestion.server"]
    ports:
      - "${TRACKER_PORT:-8881}:${TRACKER_PORT:-8881}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', int(__import__('os').environ.get('TRACKER_PORT','8881'))), 2); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "fleet_tracker.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "fleet-tracker", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
