services:
  migrate:
    build: .
    environment:
      DIRECT_DATABASE_URL: "${DIRECT_DATABASE_URL:-}"
      TEST_DATABASE_URL: "${TEST_DATABASE_URL:-}"
      MIGRATION_CONFIRM_PRODUCTION: "${MIGRATION_CONFIRM_PRODUCTION:-}"
    command: ["sh", "-c", "for attempt in 1 2 3 4 5 6; do fleet-tracker migrate && exit 0; sleep 5; done; exit 1"]
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  ingestion:
    build: .
    environment:
      DATABASE_URL: "${FLEET_INGEST_DATABASE_URL:?FLEET_INGEST_DATABASE_URL must be set}"
      DEVICE_SECRET_KEY_B64: "${DEVICE_SECRET_KEY_B64:?DEVICE_SECRET_KEY_B64 must be set}"
      DEVICE_AUTH_PEPPER_B64: "${DEVICE_AUTH_PEPPER_B64:?DEVICE_AUTH_PEPPER_B64 must be set}"
      TRACKER_PORT: "${TRACKER_PORT:-8881}"
      TRACKER_HOST: "${TRACKER_HOST:-0.0.0.0}"
      FRAME_MAX_BYTES: "${FRAME_MAX_BYTES:-4096}"
      FRAME_BUFFER_MAX_BYTES: "${FRAME_BUFFER_MAX_BYTES:-8192}"
      IDLE_TIMEOUT_SECONDS: "${IDLE_TIMEOUT_SECONDS:-180}"
      MAX_CONNECTIONS: "${MAX_CONNECTIONS:-256}"
      MAX_CONNECTIONS_PER_IP: "${MAX_CONNECTIONS_PER_IP:-8}"
      AUTH_ATTEMPTS_PER_MINUTE: "${AUTH_ATTEMPTS_PER_MINUTE:-20}"
      AUTHENTICATED_CONNECTION_IDLE_SECONDS: "${AUTHENTICATED_CONNECTION_IDLE_SECONDS:-60}"
      POSITION_MIN_INTERVAL_SECONDS: "${POSITION_MIN_INTERVAL_SECONDS:-0}"
    command: ["python", "-m", "fleet_tracker.ingestion.server"]
    ports:
      - "${TRACKER_PORT:-8881}:${TRACKER_PORT:-8881}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', int(__import__('os').environ.get('TRACKER_PORT','8881'))), 2); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build: .
    environment:
      DATABASE_URL: "${FLEET_API_DATABASE_URL:?FLEET_API_DATABASE_URL must be set}"
      FLEET_API_DATABASE_URL: "${FLEET_API_DATABASE_URL:?FLEET_API_DATABASE_URL must be set}"
      DEVICE_SECRET_KEY_B64: "${DEVICE_SECRET_KEY_B64:?DEVICE_SECRET_KEY_B64 must be set}"
      DEVICE_AUTH_PEPPER_B64: "${DEVICE_AUTH_PEPPER_B64:?DEVICE_AUTH_PEPPER_B64 must be set}"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-manual-link}"
      PASSWORD_BREACHED_LIST_PATH: "${PASSWORD_BREACHED_LIST_PATH:-config/common-passwords.txt}"
      PASSWORD_HASH_MAX_CONCURRENCY: "${PASSWORD_HASH_MAX_CONCURRENCY:-2}"
      SSE_MAX_STREAMS: "${SSE_MAX_STREAMS:-16}"
      VEHICLE_OFFLINE_AFTER_SECONDS: "${VEHICLE_OFFLINE_AFTER_SECONDS:-300}"
      VEHICLE_MOVING_SPEED_KMH: "${VEHICLE_MOVING_SPEED_KMH:-1}"
    command: ["python", "-m", "fleet_tracker.api_server"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: ./web
      args:
        VITE_MAP_STYLE_URL: "${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}"
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  worker:
    build: .
    environment:
      DATABASE_URL: "${FLEET_WORKER_DATABASE_URL:?FLEET_WORKER_DATABASE_URL must be set}"
      DEVICE_SECRET_KEY_B64: "${DEVICE_SECRET_KEY_B64:?DEVICE_SECRET_KEY_B64 must be set}"
      DEVICE_AUTH_PEPPER_B64: "${DEVICE_AUTH_PEPPER_B64:?DEVICE_AUTH_PEPPER_B64 must be set}"
    command: ["python", "-m", "fleet_tracker.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "fleet-tracker", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
