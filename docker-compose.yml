services:
  migrate:
    build: .
    env_file: .env
    command: ["sh", "-c", "for attempt in 1 2 3 4 5 6; do alembic upgrade head && exit 0; sleep 5; done; exit 1"]
    mem_limit: 256m

  ingestion:
    build: .
    env_file: .env
    environment:
      TRACKER_PORT: "${TRACKER_PORT:-8881}"
    command: ["python", "-m", "fleet_tracker.ingestion.server"]
    ports:
      - "${TRACKER_PORT:-8881}:${TRACKER_PORT:-8881}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "fleet_tracker.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped
